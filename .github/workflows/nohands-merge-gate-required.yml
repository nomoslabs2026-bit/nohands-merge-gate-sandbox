name: NO HANDS Merge Gate Required Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  required-check:
    name: NO HANDS Merge Gate Required Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact head binding
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run synthetic enforcement adapter
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node sandbox/synthetic-enforcement-adapter.mjs
